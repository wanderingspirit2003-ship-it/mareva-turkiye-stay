services:
  mareva:
    build:
      context: .
      dockerfile: Dockerfile
    command: ["node", "server.mjs"]
    ports:
      - "80:80"
    environment:
      NODE_ENV: production
      PORT: "80"
      PUBLIC_PORT: "80"
      VINEXT_PORT: "3001"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1/health').then((response) => process.exit(response.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 10s
